<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas from the 2G Boys</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for stylized typography -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel:wght@600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Artistic Parallax Winter Wonderland Background -->
    <div class="winter-bg">
        <div class="layer distant-mountains"></div>
        <div class="layer pine-forest-back"></div>
        <div class="layer snow-hills-mid"></div>
        <div class="layer snow-hills-front"></div>
    </div>

    <!-- Snowflakes Layer (Generated via JS for uniqueness) -->
    <canvas id="snowCanvas"></canvas>

    <!-- Main Interactive Stage -->
    <main class="stage">
        <!-- Flying Pixel Book with Wings -->
        <div id="pixelBook" class="book-container flying">
            <div class="wings left-wing"></div>
            <div class="book-sprite"></div>
            <div class="wings right-wing"></div>
        </div>

        <!-- Book Open Modal / Popup View -->
        <div id="bookModal" class="book-modal hidden">
            <div class="book-spread">
                <!-- Light & Magic Effects Container -->
                <div class="magic-effects"></div>
                
                <div class="book-page left-page">
                    <p class="greeting-text">"MERRY CHRISTMAS,<br>from the 2G boys of the free land of America."</p>
                </div>
                
                <div class="book-page right-page">
                    <!-- Video Container for Home Alone Facepalm -->
                    <div id="videoContainer" class="video-container hidden">
                        <video id="homeAloneVid" src="home_alone.mp4" loop playsinline></video>
                    </div>
                </div>
                
                <button id="closeBookBtn" class="close-btn">✕</button>
            </div>
        </div>

        <!-- Friend Name Popup (Yu-Gi-Oh Duel Links style banner) -->
        <div id="namePopup" class="name-popup hidden">
            <div class="duel-banner">
                <span id="friendName">Friend Name</span>
            </div>
        </div>
    </main>

    <!-- Audio & Theme Controller UI -->
    <footer class="controls-bar">
        <div class="music-selector">
            <button class="music-btn active" data-track="track1.mp3">🎵 Chill Lofi Carol</button>
            <button class="music-btn" data-track="track2.mp3">🎄 8-Bit Winter Synth</button>
        </div>
        <audio id="bgAudio" loop></audio>
    </footer>

    <script src="script.js"></script>
</body>
</html>
